name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          locked: true

      - name: Check formatting
        run: pixi run -e dev format --check

      - name: Lint
        run: pixi run -e dev lint

      - name: Type check
        run: pixi run -e dev typecheck

      - name: Test
        run: pixi run -e dev test -v

      - name: Build and verify distributions
        run: pixi run -e dev check-build

  python-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install with packaging 25 compatibility pin
        run: python -m pip install "packaging==25.0" pytest pytest-asyncio pytest-cov snakemake .

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run tests
        run: pytest -q tests
